services:
  - type: web
    name: northstar-career-workspace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
